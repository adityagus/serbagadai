services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    image: serbagadai-app
    container_name: serbagadai-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www/html/application
    command: >
      sh -c "mkdir -p /var/www/html/storage
      /var/www/html/application/storage/framework/views
      /var/www/html/application/storage/framework/sessions
      /var/www/html/application/storage/framework/cache/data
      /var/www/html/application/storage/logs
      /var/www/html/application/bootstrap/cache &&
      cp -rn /var/www/html/application/storage/* /var/www/html/storage/ 2>/dev/null || true &&
      chmod -R 777 /var/www/html/storage /var/www/html/application/storage /var/www/html/application/bootstrap/cache &&
      php-fpm"
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
    networks:
      - serbagadai-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: nginx:alpine
    container_name: serbagadai-web
    restart: unless-stopped
    tty: true
    ports:
      - "${APP_PORT:-8024}:80"
    volumes:
      - ./:/var/www/html
      - ./storage:/var/www/html/storage
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - serbagadai-network
    depends_on:
      - app

networks:
  serbagadai-network:
    driver: bridge
