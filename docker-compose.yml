services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    image: serbagadai-app
    container_name: serbagadai-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www/html/application
    volumes:
      - ./:/var/www/html
    networks:
      - serbagadai-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    image: nginx:alpine
    container_name: serbagadai-web
    restart: unless-stopped
    tty: true
    ports:
      - "${APP_PORT:-8024}:80"
    volumes:
      - ./:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - serbagadai-network
    depends_on:
      - app

networks:
  serbagadai-network:
    driver: bridge
